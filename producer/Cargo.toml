[package]
name = "producer"
version = "0.1.0"
edition = "2024"

[dependencies]
rdkafka = { version = "0.39.0", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
uuid = { version = "1.23.1", features = ["v4"] }
