[package]
name = "producer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
rand = "0.10.1"
rdkafka = { version = "0.39.0", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
uuid = { version = "1.23.1", features = ["v4", "v7"] }
